<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>בנניה 🍌 | עיר העוקבים בזמן אמת</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --banana-yellow: #FFE135;
      --banana-cream: #FFF9D2;
      --dark-border: #1A1A1A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #B8E6FA;
      touch-action: none;
    }

    /* מסך טעינה */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #B8E6FA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
      padding: 20px;
    }

    .banana-icon {
      font-size: 4.5rem;
      margin-bottom: 10px;
      animation: bounce 0.9s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      from { transform: translateY(0) rotate(-6deg); }
      to { transform: translateY(-15px) rotate(6deg); }
    }

    .loading-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .progress-box {
      width: 260px;
      height: 18px;
      background: #fff;
      border: 3px solid var(--dark-border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--banana-yellow);
      transition: width 0.25s ease;
    }

    .loading-sub {
      font-size: 0.95rem;
      font-weight: 600;
      color: #222;
      text-align: center;
    }

    #canvasContainer {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      touch-action: none;
    }

    /* כוונת עדינה במרכז המסך במצב עוקב */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 8;
      opacity: 0.55;
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #fff;
      border: 1px solid #1A1A1A;
      border-radius: 2px;
    }

    #crosshair::before {
      top: 6px;
      left: 0;
      width: 16px;
      height: 4px;
    }

    #crosshair::after {
      top: 0;
      left: 6px;
      width: 4px;
      height: 16px;
    }

    /* שכבת תוויות רחובות ובועות דיבור */
    #labelsLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .map-label {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.93);
      border: 2px solid var(--dark-border);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--dark-border);
      color: var(--dark-border);
    }

    .map-label.landmark {
      background: var(--banana-yellow);
      font-size: 0.8rem;
      padding: 4px 11px;
    }

    .avatar-ui {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 12;
    }

    .chat-bubble {
      background: #FFFFFF;
      border: 2.5px solid var(--dark-border);
      border-radius: 14px;
      padding: 5px 10px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--dark-border);
      max-width: 160px;
      text-align: center;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
      position: relative;
      display: none;
      animation: popBubble 0.2s ease-out;
    }

    @keyframes popBubble {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* סרגל עליון מותאם לטלפון */
    .top-ui {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .pill {
      pointer-events: auto;
      background: #fff;
      border: 2.5px solid var(--dark-border);
      border-radius: 13px;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 0 var(--dark-border);
      cursor: pointer;
    }

    .pill-yellow {
      background: var(--banana-yellow);
    }

    .sub-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      pointer-events: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .sub-row::-webkit-scrollbar {
      display: none;
    }

    .action-btn {
      flex-shrink: 0;
      background: var(--dark-border);
      color: #fff;
      border: 2px solid var(--dark-border);
      border-radius: 11px;
      padding: 6px 11px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    }

    .action-btn.yellow {
      background: var(--banana-yellow);
      color: var(--dark-border);
    }

    .action-btn.active-cam {
      background: #2ECC71;
      color: var(--dark-border);
    }

    #liveToast {
      position: fixed;
      top: 105px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--banana-yellow);
      border: 2.5px solid var(--dark-border);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 900;
      font-size: 0.85rem;
      box-shadow: 0 4px 0 var(--dark-border);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #liveToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ג'ויסטיק מגע לטלפון */
    #joystickZone {
      position: fixed;
      bottom: 82px;
      left: 16px;
      width: 98px;
      height: 98px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(4px);
      border: 2.5px solid var(--dark-border);
      border-radius: 50%;
      z-index: 22;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    #joystickKnob {
      width: 42px;
      height: 42px;
      background: var(--banana-yellow);
      border: 2.5px solid var(--dark-border);
      border-radius: 50%;
      box-shadow: 0 3px 0 var(--dark-border);
      pointer-events: none;
      transition: transform 0.04s linear;
    }

    /* כפתורי תגובה מהירים */
    .quick-emotes {
      position: fixed;
      bottom: 82px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 22;
    }

    .emote-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--dark-border);
      box-shadow: 0 3px 0 var(--dark-border);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* שורת חיפוש תחתונה */
    .bottom-bar {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border: 3px solid var(--dark-border);
      border-radius: 16px;
      padding: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 5px 0 var(--dark-border);
      z-index: 25;
    }

    .search-btn {
      background: var(--banana-yellow);
      border: 2px solid var(--dark-border);
      border-radius: 11px;
      padding: 9px 12px;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-weight: 700;
      direction: ltr;
      text-align: left;
      padding: 4px 8px;
      min-width: 0;
    }

    /* כרטיס פרטי בית */
    #houseCard {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      max-width: 480px;
      margin: 0 auto;
      background: var(--banana-cream);
      border: 3px solid var(--dark-border);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 7px 0 var(--dark-border);
      z-index: 40;
      display: none;
    }

    .close-card {
      position: absolute;
      top: 10px;
      left: 14px;
      background: none;
      border: none;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
    }

    .house-title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .street-subtitle {
      font-size: 0.98rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    .residents-box {
      max-height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .resident-item {
      background: #fff;
      border: 2px solid var(--dark-border);
      border-radius: 10px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
      text-decoration: none;
      color: var(--dark-border);
    }

    .share-btn {
      background: #fff;
      border: 2px solid var(--dark-border);
      border-radius: 11px;
      padding: 7px 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--dark-border);
    }

    /* חלון עיצוב דמות */
    #avatarModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .avatar-modal-box {
      background: var(--banana-cream);
      border: 3px solid var(--dark-border);
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 0 var(--dark-border);
    }

    .avatar-modal-box h2 {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .field-label {
      font-weight: 800;
      font-size: 0.9rem;
      margin: 10px 0 6px;
      text-align: right;
    }

    .color-swatches, .hat-options {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid var(--dark-border);
      cursor: pointer;
    }

    .swatch.selected {
      transform: scale(1.18);
      box-shadow: 0 0 0 3px #fff inset;
    }

    .hat-btn {
      background: #fff;
      border: 2px solid var(--dark-border);
      border-radius: 11px;
      padding: 6px 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .hat-btn.selected {
      background: var(--banana-yellow);
    }
  </style>
</head>
<body>

  <!-- מסך טעינה -->
  <div id="loadingScreen">
    <div class="banana-icon">🍌</div>
    <div class="loading-title">בונים את בנניה...</div>
    <div class="progress-box">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="loadingText" class="loading-sub">מקימים את הקולוסיאום והאמפייר סטייט...</div>
  </div>

  <!-- סרגל עליון -->
  <div class="top-ui">
    <div class="top-row">
      <div class="pill pill-yellow">בנניה 🍌</div>
      <div class="pill">
        <span>🏠</span>
        <span id="populationCount">0</span>
      </div>
      <div id="dayToggle" class="pill">
        <span id="dayIcon">☀️</span>
        <span id="dayLabel">יום 1</span>
      </div>
    </div>

    <div class="sub-row">
      <button id="openAvatarBtn" class="action-btn yellow">👕 דמות</button>
      <button id="followCamBtn" class="action-btn active-cam">🎥 עוקב</button>
      <button id="flyBenGvirBtn" class="action-btn">🗽 כיכר בן גביר</button>
      <button id="flyColosseumBtn" class="action-btn">🏛️ הקולוסיאום</button>
      <button id="flyEmpireBtn" class="action-btn">🏙️ האמפייר סטייט</button>
      <button id="flyAirportBtn" class="action-btn">✈️ נמל תעופה</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="liveToast">🍌 נבנה בית חדש!</div>
  <div id="labelsLayer"></div>
  <div id="canvasContainer"></div>

  <!-- ג'ויסטיק מגע לטלפון -->
  <div id="joystickZone" title="הזז">
    <div id="joystickKnob"></div>
  </div>

  <!-- כפתורי אימוג'י מהירים -->
  <div id="quickEmotes" class="quick-emotes">
    <button class="emote-circle" data-msg="🍌">🍌</button>
    <button class="emote-circle" data-msg="👋">👋</button>
    <button class="emote-circle" data-msg="🔥">🔥</button>
  </div>

  <!-- שורת חיפוש תחתונה -->
  <div class="bottom-bar">
    <button id="searchBtn" class="search-btn">איפה הבית שלי?</button>
    <input id="usernameInput" class="search-input" type="text" placeholder="@instagram" />
  </div>

  <!-- כרטיס פרטי בית -->
  <div id="houseCard">
    <button id="closeCardBtn" class="close-card">✕</button>
    <div id="cardHouseNumber" class="house-title">בית מספר 1</div>
    <div id="cardStreetName" class="street-subtitle">הבננות האלגנטיות 1</div>
    <div id="cardResidents" class="residents-box"></div>
    <div style="display:flex; justify-content:flex-end;">
      <button id="shareBtn" class="share-btn">שיתוף</button>
    </div>
  </div>

  <!-- חלון עיצוב דמות -->
  <div id="avatarModal">
    <div class="avatar-modal-box">
      <h2>עיצוב הדמות 🍌</h2>
      <div class="field-label">צבע דמות:</div>
      <div id="colorSwatches" class="color-swatches"></div>

      <div class="field-label">כובע:</div>
      <div id="hatOptions" class="hat-options">
        <button class="hat-btn selected" data-hat="banana">🍌 בננה</button>
        <button class="hat-btn" data-hat="crown">👑 כתר</button>
        <button class="hat-btn" data-hat="cap">🧢 מצחייה</button>
        <button class="hat-btn" data-hat="kippa">⚪ כיפה</button>
      </div>

      <button id="saveAvatarBtn" class="search-btn" style="width:100%; margin-top:10px; padding:11px;">שמור וצא לעיר! 🚶‍♂️</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    /**************************************************************
     * 1. מסך טעינה
     **************************************************************/
    const loadingSteps = [
      "סוללים את 4 השדרות הראשיות של בנניה...",
      "מקימים את הקולוסיאום בכיכר המזרחית...",
      "בונים את האמפייר סטייט בילדינג ברובע המערבי...",
      "מציבים את פסל בן גביר ונמל התעופה הצפוני...",
      "מכינים את דמויות התושבים..."
    ];
    let loadVal = 0;
    const progBar = document.getElementById("progressBar");
    const loadTxt = document.getElementById("loadingText");
    const loadScr = document.getElementById("loadingScreen");

    const loadTimer = setInterval(() => {
      loadVal += 25;
      progBar.style.width = Math.min(loadVal, 100) + "%";
      loadTxt.textContent = loadingSteps[Math.min(Math.floor(loadVal / 25), loadingSteps.length - 1)];
      if (loadVal >= 100) {
        clearInterval(loadTimer);
        setTimeout(() => {
          loadScr.style.opacity = "0";
          setTimeout(() => loadScr.style.display = "none", 450);
        }, 250);
      }
    }, 320);

    const streetNames = [
      "הבננות האלגנטיות", "הדורבנים העגלגלים", "החלזונות הטרופיים",
      "הקופים המנומסים", "הקליפות המחליקות", "הפלמינגואים המבולבלים",
      "העצלנים החרוצים", "התוכים המזמרים", "השייקים המבעבעים",
      "האגוזים המעופפים", "הבבונים המשועשעים", "הדקלים המתנדנדים"
    ];

    // פונקציית עזר לסיבוב זוויות חלק ורך ללא קפיצות
    function lerpAngle(current, target, factor) {
      let diff = ((target - current + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return current + diff * factor;
    }

    /**************************************************************
     * 2. סצנת תלת-ממד עשירה
     **************************************************************/
    const container = document.getElementById("canvasContainer");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xB8E6FA);
    scene.fog = new THREE.FogExp2(0xB8E6FA, 0.0012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.8, 2600);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    function createSignTexture(text, bgColor = "#1A1A1A", textColor = "#FFE135") {
      const cvs = document.createElement("canvas");
      cvs.width = 1024;
      cvs.height = 256;
      const ctx = cvs.getContext("2d");
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.font = "900 96px Rubik, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 12;
      ctx.strokeStyle = "#081B4B";
      ctx.strokeText(text, cvs.width / 2, cvs.height / 2);
      ctx.fillStyle = textColor;
      ctx.fillText(text, cvs.width / 2, cvs.height / 2);
      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // OrbitControls עבור מצב "חופשי" בלבד
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = false;
    controls.panSpeed = 1.35;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 12;
    controls.maxDistance = 440;
    controls.enabled = false;

    controls.mouseButtons = {
      LEFT: THREE.MOUSE.PAN,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.ROTATE
    };
    controls.touches = {
      ONE: THREE.TOUCH.PAN,
      TWO: THREE.TOUCH.DOLLY_ROTATE
    };

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x559E38, 0.7);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff6dd, 1.15);
    dirLight.position.set(160, 240, 140);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 260;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.camera.far = 750;
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1800, 1800),
      new THREE.MeshStandardMaterial({ color: 0x86D85B, roughness: 0.92 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x3C3F44, roughness: 0.85, side: THREE.DoubleSide });

    for (let i = 0; i < 28; i++) {

      const mr = 35 + (i % 4) * 12;
      const mGroup = new THREE.Group();
      mGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      const mCone = new THREE.Mesh(new THREE.ConeGeometry(mr, mh, 7), mountainMat);
      mCone.position.y = mh / 2;

      if (mh > 65) {

        cap.position.y = mh * 0.83;
        mGroup.add(cap);

      for (let p = 0; p < puffs; p++) {
        const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(4 + (p % 2) * 2, 1), cloudMat);
        puff.position.set((p - 1) * 4.2, (p % 2) * 1.2, (p % 3 - 1) * 1.5);

    /**************************************************************

    const numArches = 36;

      const arcSpan = isTopAsymmetric ? Math.PI * 1.15 : Math.PI * 2;
      const ringLintels = new THREE.Mesh(
        new THREE.CylinderGeometry(outerRadius + 0.3, outerRadius + 0.3, 0.85, 48, 1, false, 0, arcSpan),

      );

      ringLintels.castShadow = true;
      colosseumGroup.add(ringLintels);

      for (let a = 0; a < numArches; a++) {
        const angle = (a / numArches) * Math.PI * 2;
        if (isTopAsymmetric && angle > arcSpan) continue;

        const px = Math.cos(angle) * outerRadius;
        const pz = Math.sin(angle) * outerRadius;

        const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.25, 3.8, 1.55), travertineMat);
        pillar.position.set(px, tierY + 2.0, pz);
        pillar.rotation.y = -angle;

        pillar.receiveShadow = true;
        colosseumGroup.add(pillar);

          const ix = Math.cos(angle) * innerWallRadius;
          const iz = Math.sin(angle) * innerWallRadius;
          const innerPillar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.8, 1.2), innerStoneMat);
          innerPillar.position.set(ix, tierY + 2.0, iz);
          innerPillar.rotation.y = -angle;
          colosseumGroup.add(innerPillar);

    const blockSize = 15;
    const gridRadius = 11;
    const emptyPlots = [];

    for (let i = -gridRadius; i <= gridRadius; i++) {
      if (i === 0) continue;
      const roadH = new THREE.Mesh(new THREE.PlaneGeometry(gridRadius * 2 * blockSize, 2.2), roadMat);
      roadH.rotation.x = -Math.PI / 2;

      roadV.rotation.x = -Math.PI / 2;
      roadV.position.set(i * blockSize, 0.03, 0);
      scene.add(roadV);
    }

    function isReservedZone(x, z) {
      if (Math.abs(x) < 7.5 || Math.abs(z) < 7.5) return true;
      if (Math.hypot(x, z) < 23) return true;
      if (Math.hypot(x - colosseumPos.x, z - colosseumPos.z) < 35) return true;
      if (Math.abs(x - empirePos.x) < 24 && Math.abs(z - empirePos.z) < 24) return true;
      if (Math.abs(x - airportPos.x) < 70 && Math.abs(z - airportPos.z) < 42) return true;
      return false;
    }

    for (let gx = -gridRadius + 1; gx < gridRadius; gx++) {
      for (let gz = -gridRadius + 1; gz < gridRadius; gz++) {
        const bx = gx * blockSize;
        const bz = gz * blockSize;

        if (isReservedZone(bx, bz)) continue;

        const sidewalkBlock = new THREE.Mesh(
          new THREE.BoxGeometry(11.6, 0.28, 11.6),
          sidewalkMat
        );
        sidewalkBlock.position.set(bx, 0.14, bz);
        sidewalkBlock.receiveShadow = true;
        scene.add(sidewalkBlock);

        if ((Math.abs(gx) + Math.abs(gz)) % 3 === 0) {
          createPalmTree(bx - 5.1, bz - 5.1, 0.9);
        }

        const subPlots = [[-3.4, -3.4], [3.4, -3.4], [-3.4, 3.4], [3.4, 3.4]];
        subPlots.forEach(([ox, oz], idx) => {
          const px = bx + ox;
          const pz = bz + oz;
          if (isReservedZone(px, pz)) return;

          const plotPad = new THREE.Mesh(
            new THREE.BoxGeometry(3.4, 0.06, 3.4),
            new THREE.MeshStandardMaterial({ color: 0x80CE58, roughness: 0.9 })

    let lookPointerId = null;

    renderer.domElement.addEventListener("pointerdown", e => {

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxRadius = rect.width / 2 - 14;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxRadius;
      joyVec.y = dy / maxRadius;
    }

    joystickZone.addEventListener("pointerdown", e => {
      e.stopPropagation();
      joyActive = true;
      joystickZone.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointermove", e => {
      if (!joyActive) return;
      e.stopPropagation();
      handleJoystickMove(e.clientX, e.clientY);
    });

    function resetJoystick() {
      joyActive = false;
      joyVec.x = 0;

    function spawnHouseOnMap(serverHouse, shouldFocus = false) {
      if (builtHousesMap.has(serverHouse.houseNumber)) return builtHousesMap.get(serverHouse.houseNumber);

      const idx = serverHouse.houseNumber;
      const plot = emptyPlots[nextPlotIndex % emptyPlots.length];
      nextPlotIndex++;

      const houseGroup = new THREE.Group();
      houseGroup.position.set(plot.x, 0.30, plot.z);

      const isTower = idx % 7 === 0;
      const height = isTower ? 8.5 : (2.6 + (idx % 3) * 0.75);
      const width = isTower ? 3.1 : 2.6;

      const wallColors = [0xFFF9D2, 0xFFE135, 0xFFFFFF, 0xFFE082];
      const roofColors = [0xE65100, 0x2ECC71, 0xF4B400, 0xD84315];

      const bodyMesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, width),
        new THREE.MeshStandardMaterial({ color: wallColors[idx % wallColors.length], roughness: 0.55 })
      );
      bodyMesh.position.y = height / 2;
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      houseGroup.add(bodyMesh);

      if (!isTower) {
        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(width * 0.82, 1.65, 4),
          new THREE.MeshStandardMaterial({ color: roofColors[idx % roofColors.length], roughness: 0.5 })
        );
        roof.position.y = height + 0.82;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        houseGroup.add(roof);
      }

      const house3D = {
        houseNumber: serverHouse.houseNumber,
        street: serverHouse.street || plot.street,
        residents: serverHouse.residents,
        group: houseGroup,
        height
      };

      bodyMesh.userData = house3D;
      clickableHouses.push(bodyMesh);
      builtHousesMap.set(serverHouse.houseNumber, house3D);
      serverHouse.residents.forEach(u => userToHouse.set(u.toLowerCase(), house3D));

      houseGroup.scale.set(0.01, 0.01, 0.01);
      scene.add(houseGroup);
      growingGroups.push(houseGroup);

      document.getElementById("populationCount").textContent = builtHousesMap.size.toLocaleString();

      if (shouldFocus) {
        focusOnHouse(house3D);
        showToast(`🍌 @${serverHouse.residents[0]} עקב ובנה את בית #${serverHouse.houseNumber}!`);
      }

      return house3D;
    }

      const raw = document.getElementById("usernameInput").value.trim().replace(/^@/, "");
      if (!raw) return;

      const existing = userToHouse.get(raw.toLowerCase());
      if (existing) {
        focusOnHouse(existing);
        return;
      }

      try {
        const res = await fetch('/api/claim-house', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: raw })
        });
        const data = await res.json();
        if (data && data.house) {
          const h3D = spawnHouseOnMap(data.house, true);
          focusOnHouse(h3D);
        }
      } catch {
        const nextNum = builtHousesMap.size + 1;
        spawnHouseOnMap({ houseNumber: nextNum, residents: [raw] }, true);
      }
    }

    document.getElementById("searchBtn").addEventListener("click", handleSearch);
    document.getElementById("usernameInput").addEventListener("keydown", e => {
      if (e.key === "Enter") handleSearch();
    });

    document.getElementById("closeCardBtn").addEventListener("click", () => {
      document.getElementById("houseCard").style.display = "none";
      marker.visible = false;
      camTargetPos = null;
      camLookAtPos = null;
    });

    document.getElementById("flyBenGvirBtn").addEventListener("click", () => {
      flyToPoint(0, 16, 0, 26);
    });
    document.getElementById("flyColosseumBtn").addEventListener("click", () => {
      flyToPoint(colosseumPos.x, 10, colosseumPos.z, 36);
    });
    document.getElementById("flyEmpireBtn").addEventListener("click", () => {
      flyToPoint(empirePos.x, 26, empirePos.z, 46);
    });
    document.getElementById("flyAirportBtn").addEventListener("click", () => {
      flyToPoint(airportPos.x, 6, airportPos.z, 44);
    });

    let isNight = false;
    document.getElementById("dayToggle").addEventListener("click", () => {
      isNight = !isNight;
      scene.background.setHex(isNight ? 0x0E1528 : 0xB8E6FA);
      scene.fog.color.setHex(isNight ? 0x0E1528 : 0xB8E6FA);
      hemiLight.intensity = isNight ? 0.25 : 0.7;
      dirLight.intensity = isNight ? 0.35 : 1.15;
      document.getElementById("dayIcon").textContent = isNight ? "🌙" : "☀️";
    });

    const keyState = {};
    window.addEventListener("keydown", e => {
      if (document.activeElement.tagName === "INPUT") return;
      keyState[e.code] = true;
    });
    window.addEventListener("keyup", e => { keyState[e.code] = false; });

    /**************************************************************
     * 14. לולאת האנימציה (תנועה רכה ונעימה לעין של השחקן והמצלמה)
     **************************************************************/
    function updateAvatarMovement(av, t, isMainPlayer = false) {
      if (isMainPlayer && !followAvatarMode) {
        av.uiDiv.style.display = "none";
        return;
      }

      const dx = av.targetX - av.root.position.x;
      const dz = av.targetZ - av.root.position.z;
      const dist = Math.hypot(dx, dz);

      if (dist > 0.12) {
        const speed = isMainPlayer ? 0.22 : 0.11;
        av.root.position.x += (dx / dist) * Math.min(speed, dist);
        av.root.position.z += (dz / dist) * Math.min(speed, dist);

        // סיבוב חלק ועדין של הדמות לכיוון ההליכה (ללא שבירה חדה)
        const desiredAngle = Math.atan2(dx, dz);
        av.root.rotation.y = lerpAngle(av.root.rotation.y, desiredAngle, 0.14);

        av.body.position.y = 1.35 + Math.abs(Math.sin(t * 9.5)) * 0.16;
        av.leftFoot.position.z = 0.1 + Math.sin(t * 9.5) * 0.26;
        av.rightFoot.position.z = 0.1 - Math.sin(t * 9.5) * 0.26;
      } else {
        av.body.position.y = 1.35 + Math.sin(t * 3) * 0.04;
        av.leftFoot.position.z = 0.1;
        av.rightFoot.position.z = 0.1;
        if (isMainPlayer) walkRing.visible = false;
      }

      const headPos = av.root.position.clone();
      headPos.y += 3.2;
      const proj = headPos.project(camera);
      if (proj.z > 1) {
        av.uiDiv.style.display = "none";
      } else {
        av.uiDiv.style.display = "flex";
        av.uiDiv.style.left = `${(proj.x * 0.5 + 0.5) * window.innerWidth}px`;
        av.uiDiv.style.top = `${(-(proj.y * 0.5) + 0.5) * window.innerHeight}px`;
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      let inputX = joyActive ? joyVec.x : 0;
      let inputY = joyActive ? joyVec.y : 0;
      if (keyState["ArrowUp"] || keyState["KeyW"]) inputY -= 1;
      if (keyState["ArrowDown"] || keyState["KeyS"]) inputY += 1;
      if (keyState["ArrowLeft"] || keyState["KeyA"]) inputX -= 1;
      if (keyState["ArrowRight"] || keyState["KeyD"]) inputX += 1;

      if (Math.hypot(inputX, inputY) > 0.05) {
        if (followAvatarMode) {
          walkRing.visible = false;
          const moveScale = 0.95;

          // כשהשחקן זז לצדדים, המצלמה מסתובבת איתו בעדינות ובצורה נעימה לעין
          targetCamYaw -= inputX * 0.015;

          const forwardX = -Math.sin(currentCamYaw);
          const forwardZ = -Math.cos(currentCamYaw);
          const rightX   =  Math.cos(currentCamYaw);
          const rightZ   = -Math.sin(currentCamYaw);

          myAvatar.targetX = myAvatar.root.position.x + (forwardX * (-inputY) + rightX * inputX) * moveScale;
          myAvatar.targetZ = myAvatar.root.position.z + (forwardZ * (-inputY) + rightZ * inputX) * moveScale;
        } else {
          // במצב חופשי: השחקן מוסתר ורק המצלמה עצמה זזה במפה!
          camTargetPos = null;
          camLookAtPos = null;
          const freeCamSpeed = 1.1;
          camera.position.x += inputX * freeCamSpeed;
          camera.position.z += inputY * freeCamSpeed;
          controls.target.x += inputX * freeCamSpeed;
          controls.target.z += inputY * freeCamSpeed;
        }
      }

      updateAvatarMovement(myAvatar, t, true);
      otherAvatars.forEach(av => updateAvatarMovement(av, t, false));

      if (walkRing.visible) {
        walkRing.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.15);
      }

      if (followAvatarMode) {
        // החלקה רכה של זווית המצלמה (ללא תנועות חדות)
        currentCamYaw += (targetCamYaw - currentCamYaw) * 0.085;
        currentCamPitch += (targetCamPitch - currentCamPitch) * 0.085;

        const p = myAvatar.root.position;
        const camDist = 14.5;
        const shoulderOffset = 1.2;

        const horizDist = camDist * Math.cos(currentCamPitch);
        const vertDist  = camDist * Math.sin(currentCamPitch);

        const rightX = Math.cos(currentCamYaw);
        const rightZ = -Math.sin(currentCamYaw);

        const desiredCamX = p.x + Math.sin(currentCamYaw) * horizDist + rightX * shoulderOffset;
        const desiredCamY = p.y + 3.6 + vertDist;
        const desiredCamZ = p.z + Math.cos(currentCamYaw) * horizDist + rightZ * shoulderOffset;

        // תנועת מצלמה רכה מאוד (Damping נעים לעין)
        camera.position.lerp(new THREE.Vector3(desiredCamX, desiredCamY, desiredCamZ), 0.09);

        const lookAheadDist = 16;
        const desiredLook = new THREE.Vector3(
          p.x - Math.sin(currentCamYaw) * lookAheadDist + rightX * (shoulderOffset * 0.3),
          p.y + 2.4 - Math.sin(currentCamPitch) * 4.2,
          p.z - Math.cos(currentCamYaw) * lookAheadDist + rightZ * (shoulderOffset * 0.3)
        );

        smoothLookAt.lerp(desiredLook, 0.11);
        camera.lookAt(smoothLookAt);
      } else {
        if (camTargetPos && camLookAtPos) {
          camera.position.lerp(camTargetPos, 0.07);
          controls.target.lerp(camLookAtPos, 0.09);
          if (camera.position.distanceTo(camTargetPos) < 1.0) camTargetPos = null;
        }
        controls.update();
      }

      clouds.forEach(c => {
        c.mesh.position.x += c.speed;
        if (c.mesh.position.x > 240) c.mesh.position.x = -240;
      });

      benGvirStatue.rotation.y = Math.sin(t * 0.5) * 0.3;
      radarDish.rotation.y = t * 2.5;
      empireBeacon.scale.setScalar(0.85 + Math.sin(t * 6) * 0.25);

      runwayLights.forEach((b, idx) => {
        b.scale.setScalar(0.85 + Math.sin(t * 5 + idx) * 0.25);
      });

      const cycle = t % 16;
      if (cycle < 5) {
        const p = cycle / 5;
        const runX = airportPos.x - 48 + p * 96;
        const liftY = p > 0.55 ? Math.pow((p - 0.55) * 2.2, 2) * 20 : 1.3;
        activeJet.position.set(runX, liftY, airportPos.z - 28);
        activeJet.rotation.set(0, 0, p > 0.55 ? 0.28 : 0);
      } else {
        const airAngle = ((cycle - 5) / 11) * Math.PI * 2;
        activeJet.position.set(
          Math.cos(airAngle) * 115,
          34 + Math.sin(airAngle * 2) * 6,
          Math.sin(airAngle) * 105 - 15
        );
        activeJet.rotation.set(0.15, -airAngle + Math.PI / 2, 0);
      }

      if (marker.visible) {
        marker.position.y += Math.sin(t * 6) * 0.025;
        marker.rotation.y = t * 2.2;
      }

      for (let i = growingGroups.length - 1; i >= 0; i--) {
        const g = growingGroups[i];
        g.scale.lerp(new THREE.Vector3(1, 1, 1), 0.14);
        if (g.scale.x > 0.98) {
          g.scale.set(1, 1, 1);
          growingGroups.splice(i, 1);
        }
      }

      renderer.render(scene, camera);

      htmlLabels.forEach(item => {
        const projected = item.pos.clone().project(camera);
        if (projected.z > 1) { item.el.style.opacity = "0"; return; }
        item.el.style.left = `${(projected.x * 0.5 + 0.5) * window.innerWidth}px`;
        item.el.style.top = `${(-(projected.y * 0.5) + 0.5) * window.innerHeight}px`;
        item.el.style.opacity = (!item.isLandmark && camera.position.distanceTo(item.pos) > 160) ? "0" : "1";
      });
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
